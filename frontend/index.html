<!DOCTYPE html>
<!-- Halo, ini halaman utama. Isinya form config, hasil, visualisasi kapal, sama grafik. -->
<!-- Maaf masih polos, nanti dipercantik di Tahap 4. -->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Search Optimization - Penempatan Kendaraan pada Kapal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>LOCAL SEARCH OPTIMIZATION</h1>
    <p id="backend-status">Checking backend…</p>
  </header>

  <main>
    <section id="config">
      <h2>Konfigurasi</h2>
      <label>Algorithm
        <select id="algorithm">
          <option value="hill_climbing">Hill Climbing</option>
          <option value="simulated_annealing">Simulated Annealing</option>
          <option value="genetic_algorithm">Genetic Algorithm</option>
        </select>
      </label>
      <label>Variant
        <select id="variant">
          <option value="steepest_ascent">Steepest Ascent</option>
          <option value="stochastic">Stochastic</option>
          <option value="sideways">Sideways Move</option>
          <option value="random_restart">Random Restart</option>
        </select>
      </label>
      <label>Objective
        <select id="objective">
          <option value="objective_1">ShippingFee</option>
          <option value="objective_2">Alternatif (bonus)</option>
        </select>
      </label>
      <label>Number of Ships <input id="ship-count" type="number" value="1" min="1" /></label>
      <label>Max Iteration <input id="max-iter" type="number" value="1000" min="1" /></label>
      <button id="run-btn">RUN OPTIMIZATION</button>
    </section>

    <section id="results">
      <h2>RESULTS</h2>
      <div>Objective Value: <span id="objective-value">-</span></div>
      <div>Iteration: <span id="iteration">-</span></div>
      <div>Duration: <span id="duration">-</span></div>
    </section>

    <section id="initial-state">
      <h2>INITIAL STATE</h2>
      <div id="initial-viz" class="ship-viz">Ship Visualization</div>
    </section>

    <section id="final-state">
      <h2>FINAL STATE</h2>
      <div id="final-viz" class="ship-viz">Ship Visualization</div>
    </section>

    <section id="chart-section">
      <h2>OBJECTIVE VS ITERATION</h2>
      <canvas id="chart">Chart</canvas>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/visualization.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
